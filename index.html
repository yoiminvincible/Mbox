<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#073f39">
<title>MovieBox Pro</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;color:#fff;
 background:
 radial-gradient(circle at 25% 20%,#087b92 0,transparent 32%),
 radial-gradient(circle at 80% 75%,#064f39 0,transparent 35%),
 linear-gradient(145deg,#061b35,#063e4b 48%,#063c2c);
}
.card{
 width:min(430px,90%);padding:34px 25px 30px;text-align:center;
 border:1px solid rgba(70,240,190,.28);border-radius:24px;
 background:rgba(3,25,29,.72);backdrop-filter:blur(16px);
 box-shadow:0 0 55px rgba(0,255,190,.13),0 25px 70px rgba(0,0,0,.4);
}
.logo{
 width:105px;height:105px;object-fit:cover;border-radius:23px;
 display:block;margin:0 auto 18px;
 box-shadow:0 0 30px rgba(0,220,180,.25);
}
h1{font-size:28px;margin:0 0 7px;font-weight:850}
h1 span{color:#39d9a2}
.sub{margin:0 0 6px;color:#a9c9c4;font-size:14px}
.date{margin:0 0 24px;color:#72e0b9;font-size:12px;font-weight:700}
.buttons{display:flex;gap:10px}
.btn{
 display:flex;align-items:center;justify-content:center;gap:8px;
 border:0;border-radius:13px;padding:15px 12px;
 font-size:15px;font-weight:900;cursor:pointer;
 transition:.2s;
}
.download{
 flex:1;color:#05231e;text-decoration:none;
 background:linear-gradient(100deg,#21d3b0,#6bea5f);
 box-shadow:0 9px 30px rgba(42,224,157,.3);
}
.share{
 width:118px;color:#dffff5;
 background:rgba(19,103,91,.72);
 border:1px solid rgba(88,232,192,.25);
}
.btn:hover{transform:translateY(-2px)}
</style>
